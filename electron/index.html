<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src http://localhost:8000;" />
  <title>Gladden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="app" class="app hidden">

    <!-- Input bar -->
    <div id="interactive-zone" class="bar">

      <div class="logo-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <!-- Outer dashed orbit -->
          <circle cx="11" cy="11" r="9.5"
                  stroke="#38d9f5" stroke-width="1"
                  stroke-dasharray="2.5 2"
                  opacity="0.45"/>
          <!-- Inner orbit -->
          <circle cx="11" cy="11" r="5.5"
                  stroke="#a78bfa" stroke-width="1"
                  stroke-dasharray="4 2.5"
                  opacity="0.55"/>
          <!-- Core dot -->
          <circle cx="11" cy="11" r="2.5" fill="#38d9f5" opacity="0.95"/>
          <!-- Bright highlight -->
          <circle cx="10.2" cy="10.2" r="0.8" fill="white" opacity="0.6"/>
        </svg>
      </div>

      <div class="input-wrapper">
        <input
          id="cmd-input"
          type="text"
          class="cmd-input"
          placeholder="Ask Gladden..."
          autocomplete="off"
          spellcheck="false"
          aria-label="Command input"
        />
        <div class="input-glow"></div>
      </div>

      <div id="status-dot" class="status-dot idle" title="idle"></div>

    </div>
    <!-- /bar -->

    <!-- Log panel -->
    <div id="log-panel" class="log-panel collapsed" role="log" aria-live="polite">
      <div class="log-panel-header">
        <span class="log-panel-title">Execution Log</span>
        <button id="log-close-btn" class="log-close-btn" title="Close log">✕</button>
      </div>
      <div id="log-inner" class="log-inner">
        <span class="log-placeholder">events will appear here…</span>
      </div>
    </div>
    <!-- /log-panel -->

  </div>

  <script src="renderer.js"></script>
</body>
</html>
