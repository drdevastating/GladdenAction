<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; connect-src http://localhost:8000;" />
  <title>Gladden</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="app" class="app hidden">

    <!-- Input bar (always visible when overlay is open) -->
    <div id="interactive-zone" class="bar">

      <div class="logo-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="8" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="3 2"/>
          <circle cx="10" cy="10" r="3" fill="#4fc3f7" opacity="0.9"/>
        </svg>
      </div>

      <div class="input-wrapper">
        <input
          id="cmd-input"
          type="text"
          class="cmd-input"
          placeholder="Ask Gladden..."
          autocomplete="off"
          spellcheck="false"
          aria-label="Command input"
        />
        <div class="input-glow"></div>
      </div>

      <div id="status-dot" class="status-dot idle" title="idle"></div>

    </div>
    <!-- /bar -->

    <!-- Log panel — expands below the bar after execution -->
    <div id="log-panel" class="log-panel collapsed" role="log" aria-live="polite">
      <div class="log-panel-header">
        <span class="log-panel-title">Execution Log</span>
        <button id="log-close-btn" class="log-close-btn" title="Close log">✕</button>
      </div>
      <div id="log-inner" class="log-inner">
        <span class="log-placeholder">events will appear here…</span>
      </div>
    </div>
    <!-- /log-panel -->

  </div>

  <script src="renderer.js"></script>
</body>
</html>
